<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fake News Detection System</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>Fake News Detection System</h1>

        <p class="description">
            Enter a news article below to classify it
            using our Machine Learning model.
        </p>

        <form action="/predict" method="POST">

            <textarea
                name="news_article"
                placeholder="Paste your news article here..."
                required>{{ article if article else '' }}</textarea>

            <button type="submit">
                Check News
            </button>

        </form>

        {% if prediction %}

            <div class="result">
                <h2>Prediction: {{ prediction }}</h2>
            </div>

        {% endif %}

        {% if error %}

            <div class="error">
                {{ error }}
            </div>

        {% endif %}

    </div>

</body>

</html>
